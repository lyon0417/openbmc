# Disable additional unused features for further size reduction

# IPv6 support (not required for BMC)
CONFIG_IPV6=n

# Advanced networking protocols (not used)
# CONFIG_L2TP is not set
# CONFIG_MPLS is not set
# CONFIG_VXLAN is not set

# Bluetooth (not used)
# CONFIG_BT is not set (already disabled)

# NFC (not used)
# CONFIG_NFC is not set (already disabled)

# Some optional HID features (not used)
CONFIG_HID_SUPPORT=n

# Media support optimization (keep VIDEO_DEV for camera, but can reduce others)
CONFIG_MEDIA_CAMERA_SUPPORT=n

# Optional: Disable IPv6 tunneling if not needed
# CONFIG_IPV6_TUNNEL is not set
# CONFIG_IPV6_SIT is not set

# Misc optimizations
# CONFIG_SYSCTL_EXCEPTION_TRACE (not critical)
# CONFIG_DEBUG_STACK_USAGE (not critical)
